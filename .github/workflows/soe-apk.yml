jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: The 0.3.2 sources with the Sanctuary of Exile changes
        run: |
          set -euo pipefail
          git init -q src && cd src
          git fetch -q --depth 1 "https://github.com/$BASE_REPO.git" "refs/tags/$BASE_TAG:refs/tags/$BASE_TAG"
          git checkout -q "$BASE_TAG"
          printf '%s' "$SOE_PATCH" | tr -d ' \n' | base64 -d | gunzip | git apply --whitespace=nowarn
          printf '%s' "$SOE_PATCH2" | tr -d ' \n' | base64 -d | gunzip | git apply --whitespace=nowarn
          printf '%s' "$SOE_PATCH3" | tr -d ' \n' | base64 -d | gunzip | git apply --whitespace=nowarn
          git status --short

      - name: The engine, userland and runtime from the official release
        working-directory: src
        run: |
          set -euo pipefail
          version="${BASE_TAG#v}"
          apk="pd2-launcher-android-$version.apk"
          base="https://github.com/$BASE_REPO/releases/download/$BASE_TAG"
          curl -fsSL -o "$RUNNER_TEMP/$apk" "$base/$apk"
          curl -fsSL -o "$RUNNER_TEMP/$apk.sha256" "$base/$apk.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$apk.sha256")
          mkdir -p "$RUNNER_TEMP/base" app/src/main/assets
          unzip -q "$RUNNER_TEMP/$apk" 'assets/userland/*' 'assets/runtime/*' 'lib/arm64-v8a/libpd2launcher.so' -d "$RUNNER_TEMP/base"
          cp -r "$RUNNER_TEMP/base/assets/userland" "$RUNNER_TEMP/base/assets/runtime" app/src/main/assets/
          echo "PD2_ENGINE_BINARY=$RUNNER_TEMP/base/lib/arm64-v8a/libpd2launcher.so" >> "$GITHUB_ENV"

      - name: Debug key from the cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pd2-android/debug.keystore
          key: soe-debug-keystore

      - name: Debug key from the secret
        env:
          KEYSTORE: ${{ secrets.SOE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.cache/pd2-android
            echo "$KEYSTORE" | base64 -d > ~/.cache/pd2-android/debug.keystore
          fi

      - name: Build
        working-directory: src
        run: PD2_SOE=1 ./build.sh app

      - uses: actions/upload-artifact@v4
        with:
          name: soe-launcher-apk
          path: src/build/outputs/app-debug.apk
          if-no-files-found: error
