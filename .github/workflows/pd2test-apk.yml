# Builds "PD2Test" (com.pd2launcher.app.pd2test), the second-screen HUD test edition, on every
# push to the pd2test branch, and attaches the APK to the pre-release "pd2test-<run number>".
# As soe-apk.yml: only the app is compiled; the engine, userland and runtime come unchanged from
# the official 0.3.2 release APK (checked against its SHA-256). Its debug key has its own cache
# entry, so it never replaces the SoE Launcher's.
name: PD2Test APK

on:
  push:
    branches: [pd2test]
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_TAG: v0.3.2
  BASE_REPO: Pocketward/pd2-launcher-android

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: The engine, userland and runtime from the official release
        run: |
          set -euo pipefail
          version="${BASE_TAG#v}"
          apk="pd2-launcher-android-$version.apk"
          base="https://github.com/$BASE_REPO/releases/download/$BASE_TAG"
          curl -fsSL -o "$RUNNER_TEMP/$apk" "$base/$apk"
          curl -fsSL -o "$RUNNER_TEMP/$apk.sha256" "$base/$apk.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$apk.sha256")
          mkdir -p "$RUNNER_TEMP/base" app/src/main/assets
          unzip -q "$RUNNER_TEMP/$apk" 'assets/userland/*' 'assets/runtime/*' 'lib/arm64-v8a/libpd2launcher.so' -d "$RUNNER_TEMP/base"
          cp -r "$RUNNER_TEMP/base/assets/userland" "$RUNNER_TEMP/base/assets/runtime" app/src/main/assets/
          echo "PD2_ENGINE_BINARY=$RUNNER_TEMP/base/lib/arm64-v8a/libpd2launcher.so" >> "$GITHUB_ENV"

      - name: Debug key from the cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pd2-android/debug.keystore
          key: pd2test-debug-keystore

      - name: Build
        run: PD2_TEST=1 ./build.sh app

      # The same app as SoE Launcher (com.pd2launcher.app.soe), HUD included, signed with the
      # SoE Launcher's own debug key so it installs over it in place: the key from soe-apk.yml's
      # cache entry (restore-only, so a missing key is never replaced) or its secret. Without
      # either, no SoE build. PD2Test's key is set aside meanwhile and put back after.
      - name: Set PD2Test's key aside
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          cp build/outputs/app-debug.apk "$RUNNER_TEMP/pd2test.apk"
          mv ~/.cache/pd2-android/debug.keystore "$RUNNER_TEMP/keys/pd2test.keystore"

      - name: SoE Launcher's key from the cache
        id: soekey
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pd2-android/debug.keystore
          key: soe-debug-keystore

      - name: SoE Launcher with the HUD
        env:
          KEYSTORE: ${{ secrets.SOE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          key=~/.cache/pd2-android/debug.keystore
          if [[ ! -f $key && -n "$KEYSTORE" ]]; then echo "$KEYSTORE" | base64 -d > $key; fi
          if [[ -f $key ]]; then
            keytool -list -v -keystore $key -storepass android | grep -i 'SHA256:' || true
            PD2_SOE=1 ./build.sh app
            cp build/outputs/app-debug.apk SoE-HUD.apk
            sha256sum SoE-HUD.apk > SoE-HUD.apk.sha256
            rm -f $key
          else
            echo "::warning::No SoE Launcher key (cache entry or secret): no SoE build"
          fi

      - name: Put PD2Test's key back
        if: always()
        run: |
          [[ -f "$RUNNER_TEMP/keys/pd2test.keystore" ]] && mv "$RUNNER_TEMP/keys/pd2test.keystore" ~/.cache/pd2-android/debug.keystore || true
          [[ -f "$RUNNER_TEMP/pd2test.apk" ]] && mkdir -p build/outputs && cp "$RUNNER_TEMP/pd2test.apk" build/outputs/app-debug.apk || true

      - name: Pre-release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="pd2test-${{ github.run_number }}"
          cp build/outputs/app-debug.apk PD2Test.apk
          sha256sum PD2Test.apk > PD2Test.apk.sha256
          files="PD2Test.apk PD2Test.apk.sha256"
          [[ -f SoE-HUD.apk ]] && files="$files SoE-HUD.apk SoE-HUD.apk.sha256"
          gh release create "$tag" $files --prerelease --target "${{ github.sha }}" \
            --title "PD2Test ${{ github.run_number }}" --notes "Second-screen HUD test build from ${{ github.sha }}."
